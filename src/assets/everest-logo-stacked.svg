<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="320" height="250" fill="none">
  <!-- EVEREST RENDERING SERVICES PTY LTD — Official Stacked Vector Logo with Navy Blue Background (#0d1b2e) -->
  
  <!-- NAVY BLUE BACKGROUND -->
  <rect width="320" height="250" rx="16" fill="#0d1b2e"/>

  <!-- ICON GROUP (CENTERED) -->
  <g transform="translate(96, 10)">
    <!-- 1. Semi-Circular Arch -->
    <path d="M 16,58 A 48,48 0 0,1 112,58" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 2. Mountain Peaks ABOVE Roof Line -->
    <path d="M 36,36 L 50,20 L 60,30 L 72,14 L 82,26 L 92,36" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 50,20 L 55,30 M 72,14 L 77,26" stroke="#FFFFFF" stroke-width="1.8" opacity="0.8" stroke-linecap="round"/>

    <!-- 3. House Roof Line (Thick Gable Roof) -->
    <path d="M 12,58 L 64,26 L 116,58" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linejoin="miter" stroke-linecap="square"/>

    <!-- 4. 4-Pane Window (Inside House Under Roof) -->
    <rect x="48" y="48" width="7" height="7" fill="#FFFFFF"/>
    <rect x="57" y="48" width="7" height="7" fill="#FFFFFF"/>
    <rect x="48" y="57" width="7" height="7" fill="#FFFFFF"/>
    <rect x="57" y="57" width="7" height="7" fill="#FFFFFF"/>

    <!-- 5. Render Worker Silhouette (Inside House Under Roof) -->
    <circle cx="85" cy="44" r="2.8" fill="#FFFFFF"/>
    <path d="M 85,47 L 83,60 L 86,72 M 83,60 L 80,72" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 84,49 L 80,42 L 76,39" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <polygon points="73,37 78,36 77,41 72,42" fill="#FFFFFF"/>

    <!-- 6. Curved Swoosh Horizon Base -->
    <path d="M 8,74 Q 64,66 120,76" stroke="#FFFFFF" stroke-width="3.8" stroke-linecap="round" fill="none"/>
    <path d="M 18,80 Q 64,73 110,82" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>

  <!-- TYPOGRAPHY GROUP (CENTERED TEXT) -->
  <g text-anchor="middle" transform="translate(160, 115)">
    <!-- Primary Title: EVEREST RENDERING -->
    <text x="0" y="48" font-family="'Montserrat', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="21" fill="#FFFFFF" letter-spacing="1.2">EVEREST RENDERING</text>

    <!-- Secondary Title: SERVICES PTY LTD -->
    <text x="0" y="74" font-family="'Montserrat', 'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF" letter-spacing="3.5" opacity="0.95">SERVICES PTY LTD</text>

    <!-- Tagline: Simply the Best -->
    <text x="0" y="98" font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" font-style="italic" font-weight="500" font-size="13" fill="#FFFFFF" letter-spacing="0.5" opacity="0.85">Simply the Best</text>
  </g>
</svg>
