<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="460" height="110" fill="none">
  <!-- EVEREST RENDERING SERVICES PTY LTD — Navy Blue Vector Logo (#0d1b2e for Light Backgrounds) -->
  
  <!-- ICON GROUP (LEFT) -->
  <g transform="translate(10, 2)">
    <!-- Semi-Circular Arch -->
    <path d="M 18,52 A 46,46 0 0,1 110,52" fill="none" stroke="#0d1b2e" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Mountain Peaks -->
    <path d="M 32,50 L 46,30 L 56,40 L 68,22 L 78,36 L 88,50" fill="none" stroke="#0d1b2e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 46,30 L 52,40 M 68,22 L 73,36" stroke="#0d1b2e" stroke-width="1.8" opacity="0.85" stroke-linecap="round"/>

    <!-- Main House Roof -->
    <path d="M 16,55 L 64,21 L 112,55" fill="none" stroke="#0d1b2e" stroke-width="6.5" stroke-linejoin="miter" stroke-linecap="square"/>

    <!-- 4-Pane Window (2x2 Grid) -->
    <rect x="52" y="50" width="7" height="7" fill="#0d1b2e"/>
    <rect x="61" y="50" width="7" height="7" fill="#0d1b2e"/>
    <rect x="52" y="59" width="7" height="7" fill="#0d1b2e"/>
    <rect x="61" y="59" width="7" height="7" fill="#0d1b2e"/>

    <!-- Render Worker Silhouette -->
    <circle cx="85" cy="46" r="2.8" fill="#0d1b2e"/>
    <!-- Body & Legs -->
    <path d="M 85,49 L 83,62 L 86,73 M 83,62 L 80,73" stroke="#0d1b2e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Raised Arm with Float Trowel -->
    <path d="M 84,51 L 80,44 L 76,41" stroke="#0d1b2e" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <polygon points="73,39 78,38 77,43 72,44" fill="#0d1b2e"/>

    <!-- Curved Swoosh Horizon Base -->
    <path d="M 10,73 Q 64,65 118,75" stroke="#0d1b2e" stroke-width="3.8" stroke-linecap="round" fill="none"/>
    <path d="M 20,79 Q 64,72 108,81" stroke="#0d1b2e" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>

  <!-- TYPOGRAPHY GROUP (RIGHT) -->
  <g transform="translate(142, 5)">
    <!-- Primary Title: EVEREST RENDERING -->
    <text x="0" y="44" font-family="'Montserrat', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="23" fill="#0d1b2e" letter-spacing="1.2">EVEREST RENDERING</text>

    <!-- Secondary Title: SERVICES PTY LTD -->
    <text x="0" y="67" font-family="'Montserrat', 'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="13.5" fill="#0d1b2e" letter-spacing="3.8" opacity="0.95">SERVICES PTY LTD</text>

    <!-- Tagline: Simply the Best -->
    <text x="0" y="87" font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" font-style="italic" font-weight="500" font-size="13" fill="#0d1b2e" letter-spacing="0.5" opacity="0.85">Simply the Best</text>
  </g>
</svg>
